# Builds the app and runs the unit tests on every pull request and on main.
# The build downloads the market data named in market-data.properties from the private
# MarketWatcher-data repository with the DATA_TOKEN secret (a read-only token). Here the data is
# required: without it the build fails, so a green build means every data-based test ran.
name: Build and test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, debug build and device-test build
        env:
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          MARKETWATCHER_REQUIRE_DATA: 'true'
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew testInstrumentedUnitTest assembleDebug assembleInstrumentedAndroidTest 2>&1 | tee gradle.log
      - name: Build errors
        if: failure()
        run: python3 .github/scripts/build_errors.py gradle.log
      - name: Test summary
        if: always()
        run: python3 .github/scripts/test_summary.py app/build/test-results/testInstrumentedUnitTest
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
